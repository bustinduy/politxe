[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "politxe"
version = "0.1.0"
description = "A small Matplotlib styling helper for publication-style scientific plots."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cycler>=0.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
examples = [
    "numpy>=1.24",
]

[tool.setuptools]
py-modules = ["politxe"]
