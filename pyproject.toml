[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "politxe"
version = "0.1.0"
description = "A small Matplotlib styling helper for publication-style scientific plots."
readme = "README.md"
requires-python = ">=3.9"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
dependencies = [
    "cycler>=0.11",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/bustinduy/politxe"
Repository = "https://github.com/bustinduy/politxe"
Issues = "https://github.com/bustinduy/politxe/issues"

[project.optional-dependencies]
examples = [
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]
